<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1Fi Marketplace API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#F6F6F6;
    color:#18151F;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    padding:24px;
  }
  .card{
    max-width:480px;
    background:#fff;
    border:1px solid #E7E3F2;
    border-radius:22px;
    padding:32px;
  }
  h1{ font-size:20px; margin:0 0 8px; }
  p{ color:#6B6875; line-height:1.6; font-size:14px; }
  a{ color:#6C3CE0; font-weight:600; text-decoration:none; }
  a:hover{ text-decoration:underline; }
  code{
    background:#F1ECFD;
    padding:2px 6px;
    border-radius:6px;
    font-size:13px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>1Fi Marketplace API</h1>
    <p>
      This deployment hosts the product API for the 1Fi Marketplace Flutter app —
      <a href="/api/products">GET /api/products</a> — backed by Neon Postgres.
    </p>
    <p>
      There's no browsable UI here. The Marketplace itself is the Flutter app in
      <a href="https://github.com/sethidevang/App-Submission-Marketplace">this repo</a>,
      which talks to this API by default — clone it and run <code>flutter run</code>.
    </p>
  </div>
</body>
</html>
