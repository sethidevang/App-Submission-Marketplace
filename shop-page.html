<title>1Fi Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3F1F9;
    --stage:#E7E3F3;
    --surface:#FFFFFF;
    --surface-tint:#EFEAFB;
    --track:#EEEAF7;
    --border:#E7E3F2;
    --text:#18151F;
    --text-2:#6B6875;
    --text-3:#9C99A6;
    --accent-600:#4B22C9;
    --accent-500:#6C3CE0;
    --accent-400:#8C63EA;
    --accent-50:#F1ECFD;
    --gold:#E8A317;
    --gold-soft:#FCEFD1;
    --hero-1:#1D1046;
    --hero-2:#4B22C9;
    --hero-3:#7A3FE4;
    --shadow: 0 1px 2px rgba(24,16,40,.04), 0 8px 24px rgba(24,16,40,.06);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131019;
      --stage:#0C0A12;
      --surface:#1D1926;
      --surface-tint:#241F32;
      --track:#221D2E;
      --border:#2C273A;
      --text:#F3F1F8;
      --text-2:#ACA8B8;
      --text-3:#7C7889;
      --accent-600:#8C63EA;
      --accent-500:#9B7BFF;
      --accent-400:#B29CFF;
      --accent-50:#241F3A;
      --gold:#F0B429;
      --gold-soft:#3A2E12;
      --hero-1:#0E0824;
      --hero-2:#341A85;
      --hero-3:#5B31C9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131019;
    --stage:#0C0A12;
    --surface:#1D1926;
    --surface-tint:#241F32;
    --track:#221D2E;
    --border:#2C273A;
    --text:#F3F1F8;
    --text-2:#ACA8B8;
    --text-3:#7C7889;
    --accent-600:#8C63EA;
    --accent-500:#9B7BFF;
    --accent-400:#B29CFF;
    --accent-50:#241F3A;
    --gold:#F0B429;
    --gold-soft:#3A2E12;
    --hero-1:#0E0824;
    --hero-2:#341A85;
    --hero-3:#5B31C9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
  /* Local preview toggle — overrides tokens on body directly so it works
     even when the host page stamps its own data-theme on <html>. */
  body.force-dark{
    --bg:#131019; --stage:#0C0A12; --surface:#1D1926; --surface-tint:#241F32;
    --track:#221D2E; --border:#2C273A; --text:#F3F1F8; --text-2:#ACA8B8; --text-3:#7C7889;
    --accent-600:#8C63EA; --accent-500:#9B7BFF; --accent-400:#B29CFF; --accent-50:#241F3A;
    --gold:#F0B429; --gold-soft:#3A2E12;
    --hero-1:#0E0824; --hero-2:#341A85; --hero-3:#5B31C9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
  body.force-light{
    --bg:#F3F1F9; --stage:#E7E3F3; --surface:#FFFFFF; --surface-tint:#EFEAFB;
    --track:#EEEAF7; --border:#E7E3F2; --text:#18151F; --text-2:#6B6875; --text-3:#9C99A6;
    --accent-600:#4B22C9; --accent-500:#6C3CE0; --accent-400:#8C63EA; --accent-50:#F1ECFD;
    --gold:#E8A317; --gold-soft:#FCEFD1;
    --hero-1:#1D1046; --hero-2:#4B22C9; --hero-3:#7A3FE4;
    --shadow: 0 1px 2px rgba(24,16,40,.04), 0 8px 24px rgba(24,16,40,.06);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--stage); color:var(--text);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh; padding:36px 16px;
  }
  .display{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;}
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background:var(--accent-50); }

  .stage-label{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--text-3); letter-spacing:.04em; text-transform:uppercase;
    font-weight:600;
  }

  .theme-toggle{
    position:fixed; top:10px; right:16px; z-index:50;
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-2);
    border-radius:999px; padding:8px 13px; font-size:12px; font-weight:600;
    box-shadow:var(--shadow);
  }
  .theme-toggle svg{ width:14px; height:14px; }
  @media (max-width:520px){ .theme-toggle{ top:calc(10px + env(safe-area-inset-top)); } }

  .phone{
    width:402px; height:min(866px,92vh);
    background:var(--bg);
    border-radius:44px;
    box-shadow:var(--shadow), 0 0 0 10px #0000, 0 0 0 1px var(--border);
    overflow:hidden;
    display:flex; flex-direction:column;
    position:relative;
  }

  .statusbar{
    flex:0 0 auto; height:46px; padding:0 26px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:15px; font-weight:700; color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .statusbar .icons{display:flex; align-items:center; gap:6px;}
  .statusbar svg{display:block;}

  .app{ flex:1; position:relative; overflow:hidden; }
  .scroll{
    position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:14px;
  }
  .scroll::-webkit-scrollbar{width:0;height:0;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative; margin:0 0 16px 0; padding:22px 22px 26px;
    background:linear-gradient(135deg,var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);
    color:#fff; overflow:hidden;
  }
  .hero-pill{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid rgba(255,255,255,.55); border-radius:999px;
    padding:6px 12px; font-size:11.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:#fff; margin-bottom:14px;
  }
  .hero h1{
    font-size:28px; line-height:1.14; font-weight:800; letter-spacing:-.01em;
    text-wrap:balance; max-width:230px;
  }
  .hero h1 em{ font-style:italic; font-weight:600; }
  .hero p{ margin-top:10px; font-size:13px; line-height:1.45; color:rgba(255,255,255,.82); max-width:220px; }
  .hero-art{ position:absolute; right:-6px; bottom:-6px; width:150px; height:150px; opacity:.98; }

  /* ---------- Tabs ---------- */
  .tabs-wrap{ padding:0 16px; margin-top:-30px; position:relative; z-index:2; }
  .tabs{
    display:flex; background:var(--track); border-radius:999px; padding:4px;
    box-shadow:var(--shadow);
  }
  .tab{
    flex:1; border:none; background:transparent; border-radius:999px;
    padding:11px 6px 9px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700;
    font-size:12.5px; color:var(--text-2); display:flex; flex-direction:column;
    align-items:center; gap:5px; transition:color .15s ease;
    white-space:nowrap;
  }
  .tab u{ display:block; width:20px; height:2.5px; border-radius:2px; background:transparent; text-decoration:none; }
  .tab.active{ background:var(--surface); color:var(--accent-500); }
  .tab.active u{ background:var(--accent-500); }

  .content-pad{ padding:16px 16px 4px; }

  .search{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:12px 16px;
    box-shadow:var(--shadow);
  }
  .search input{
    border:none; outline:none; background:transparent; font-size:14px; color:var(--text);
    width:100%; font-family:inherit;
  }
  .search input::placeholder{ color:var(--text-3); }

  /* ---------- Empty tab states ---------- */
  .empty{
    margin-top:40px; display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:14px; padding:20px 30px; color:var(--text-2);
  }
  .empty .ring{
    width:64px; height:64px; border-radius:50%; background:var(--accent-50);
    display:flex; align-items:center; justify-content:center; color:var(--accent-500);
  }
  .empty h3{ font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; color:var(--text); font-weight:700; }
  .empty p{ font-size:13px; line-height:1.5; max-width:230px; }

  /* ---------- Marketplace ---------- */
  .section-head{ margin:18px 0 12px; display:flex; flex-direction:column; gap:2px; }
  .section-head h2{ font-family:'Plus Jakarta Sans',sans-serif; font-size:19px; font-weight:800; }
  .section-head span{ font-size:12.5px; color:var(--text-2); }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 16px 4px; margin:0 -16px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; border:1px solid var(--border); background:var(--surface);
    border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600;
    color:var(--text-2);
  }
  .chip.active{ background:var(--accent-500); border-color:var(--accent-500); color:#fff; }

  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;
  }
  .card{
    background:var(--surface); border-radius:var(--radius-lg); border:1px solid var(--border);
    box-shadow:var(--shadow); overflow:hidden; text-align:left; display:flex; flex-direction:column;
    border:none; padding:0; width:100%;
  }
  .card .tile{
    height:104px; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .card .tile svg{ width:38px; height:38px; }
  .discount-badge{
    position:absolute; top:8px; left:8px; background:var(--gold-soft); color:var(--gold);
    font-size:10px; font-weight:800; padding:3px 7px; border-radius:6px; letter-spacing:.02em;
  }
  .card .body{ padding:11px 12px 13px; display:flex; flex-direction:column; gap:5px; }
  .card .brand{ font-size:10.5px; color:var(--text-3); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .card .name{ font-size:13.5px; font-weight:700; color:var(--text); line-height:1.3; font-family:'Plus Jakarta Sans',sans-serif; }
  .price-line{ display:flex; align-items:baseline; gap:6px; margin-top:2px; }
  .price-now{ font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
  .price-mrp{ font-size:11.5px; color:var(--text-3); text-decoration:line-through; font-variant-numeric:tabular-nums; }
  .emi-chip{
    margin-top:3px; align-self:flex-start; background:var(--accent-50); color:var(--accent-600);
    font-size:10.5px; font-weight:700; padding:4px 8px; border-radius:7px;
  }
  .swatches{ display:flex; gap:4px; margin-top:2px; }
  .swatch-dot{ width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.08); }

  /* ---------- Product detail ---------- */
  .detail{
    position:absolute; inset:0; background:var(--bg); transform:translateX(100%);
    transition:transform .28s cubic-bezier(.32,.72,.35,1); z-index:5; display:flex; flex-direction:column;
  }
  .detail.open{ transform:translateX(0); }
  .detail-top{
    flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:var(--bg);
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text); flex:0 0 auto;
  }
  .icon-btn svg{ width:18px; height:18px; }
  .detail-top .title{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; }
  .detail-scroll{ flex:1; overflow-y:auto; padding:0 16px 130px; }
  .detail-scroll::-webkit-scrollbar{ display:none; }

  /* ---------- Pay using 1Fi screen ---------- */
  .pay{
    position:absolute; inset:0; background:var(--bg); transform:translateX(100%);
    transition:transform .28s cubic-bezier(.32,.72,.35,1); z-index:6; display:flex; flex-direction:column;
  }
  .pay.open{ transform:translateX(0); }

  .pd-card{
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:16px; margin-bottom:14px;
  }
  .brand-pill{
    display:inline-block; background:var(--surface-tint); color:var(--text);
    font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:999px; margin-bottom:12px;
  }
  .pd-card-tile{ height:168px; border-radius:16px; display:flex; align-items:center; justify-content:center; }
  .pd-card-tile svg{ width:66px; height:66px; }

  .pd-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .pd-row .pd-name{ margin-top:0; }
  .vp-summary{ font-size:12.5px; color:var(--text-2); margin-bottom:4px; }

  .collapse-head{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    width:100%; border:none; background:transparent; padding:0;
    margin:22px 0 10px; font-size:11.5px; font-weight:700; color:var(--text-2);
    text-transform:uppercase; letter-spacing:.05em; font-family:inherit;
  }
  .collapse-head svg{ width:14px; height:14px; transition:transform .2s ease; color:var(--text-2); }
  .collapse-head.collapsed svg{ transform:rotate(180deg); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip-bubble{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    border:1.5px solid var(--border); background:var(--surface); border-radius:16px;
    padding:10px 16px; min-width:78px;
  }
  .chip-bubble.sel{ border-color:var(--accent-500); background:var(--accent-50); }
  .chip-bubble .cb-label{ font-size:13.5px; font-weight:700; color:var(--text); }
  .chip-bubble.sel .cb-label{ color:var(--accent-600); }
  .chip-bubble .cb-price{ font-size:11px; color:var(--text-2); font-variant-numeric:tabular-nums; }

  .color-row{ display:flex; flex-wrap:wrap; gap:16px; }
  .color-bubble-wrap{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:transparent; border:none; padding:2px;
  }
  .color-bubble{
    width:38px; height:38px; border-radius:50%; border:2px solid transparent;
    box-shadow:0 0 0 1px rgba(0,0,0,.08) inset;
  }
  .color-bubble.sel{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-500); }
  .color-bubble-wrap .cb-name{ font-size:11px; color:var(--text-2); max-width:78px; text-align:center; white-space:normal; line-height:1.25; }

  .amount-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; margin-top:22px;
  }
  .amount-value{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
  .plans-toggle{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    width:100%; border:none; background:transparent; font-family:inherit;
    padding-top:14px; margin-top:14px; border-top:1px solid var(--border); font-size:13px; color:var(--text);
  }
  .plans-toggle b{ font-variant-numeric:tabular-nums; }
  .plans-toggle .link{ color:var(--accent-500); font-weight:700; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .plans-toggle .link svg{ width:13px; height:13px; transition:transform .2s ease; }
  .plans-toggle .link.collapsed svg{ transform:rotate(180deg); }

  .plan-row-flat{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    border:none; background:transparent; border-top:1px solid var(--border);
    padding:12px 0; font-size:13px; color:var(--text); font-family:inherit;
  }
  .radio-sm{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; position:relative; }
  .plan-row-flat.sel .radio-sm{ border-color:var(--accent-500); }
  .plan-row-flat.sel .radio-sm::after{ content:''; position:absolute; inset:2.5px; border-radius:50%; background:var(--accent-500); }
  .plan-row-flat .pr-tenure{ font-weight:700; }
  .plan-row-flat .pr-tag{ font-size:11px; color:var(--text-2); margin-top:1px; }
  .plan-row-flat .pr-amt{ margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .plan-row-flat.sel .pr-amt{ color:var(--accent-600); }

  .paying-to{ margin-top:24px; }
  .section-label{ font-size:11.5px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.05em; }
  .payee-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .payee-avatar{
    width:42px; height:42px; border-radius:50%; background:var(--accent-50); color:var(--accent-500);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .payee-row b{ font-size:13.5px; }
  .payee-row .muted{ font-size:12px; color:var(--text-2); }

  .hero-tile{
    height:190px; border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center;
    margin-bottom:16px; position:relative;
  }
  .hero-tile svg{ width:76px; height:76px; }

  .rating-row{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2); margin-top:6px; }
  .rating-row svg{ width:13px; height:13px; }
  .rating-row b{ color:var(--text); }

  .pd-brand{ font-size:11px; color:var(--text-3); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .pd-name{ font-family:'Plus Jakarta Sans',sans-serif; font-size:19px; font-weight:800; margin-top:3px; text-wrap:balance; }

  .price-block{ display:flex; align-items:baseline; gap:10px; margin-top:14px; }
  .price-block .now{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .price-block .mrp{ font-size:14px; color:var(--text-3); text-decoration:line-through; font-variant-numeric:tabular-nums; }
  .price-block .off{ font-size:12.5px; color:var(--gold); font-weight:700; }

  .emi-hints{ margin-top:24px; }
  .emi-hint-row{ display:flex; gap:8px; overflow-x:auto; margin:10px -16px 0; padding:2px 16px 4px; }
  .emi-hint-row::-webkit-scrollbar{ display:none; }
  .emi-hint-chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--surface-tint); border-radius:12px; padding:9px 14px; min-width:68px;
  }
  .ehc-tenure{ font-size:12px; font-weight:700; color:var(--text); }
  .ehc-amt{ font-size:11px; color:var(--accent-600); font-weight:700; font-variant-numeric:tabular-nums; }
  .emi-hints-note{ display:block; font-size:11.5px; color:var(--text-3); margin-top:8px; }

  .highlights{ margin-top:24px; }
  .highlights h4{ font-family:'Plus Jakarta Sans',sans-serif; font-size:15.5px; font-weight:800; margin-bottom:10px; }
  .highlights li{ list-style:none; display:flex; gap:9px; font-size:13px; color:var(--text-2); line-height:1.5; margin-bottom:8px; }
  .highlights li svg{ width:15px; height:15px; flex:0 0 auto; margin-top:3px; color:var(--accent-500); }

  .note{
    margin-top:20px; background:var(--surface-tint); border-radius:var(--radius-md); padding:13px 14px;
    font-size:12px; color:var(--text-2); line-height:1.55; display:flex; gap:10px;
  }
  .note svg{ width:16px; height:16px; flex:0 0 auto; margin-top:1px; color:var(--accent-500); }

  .cta-bar{
    position:absolute; left:0; right:0; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .cta-info{ display:flex; flex-direction:column; }
  .cta-info span{ font-size:11px; color:var(--text-2); }
  .cta-info b{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  .cta-btn{
    border:none; background:var(--accent-500); color:#fff; font-weight:700; font-size:14px;
    padding:13px 24px; border-radius:999px; font-family:'Plus Jakarta Sans',sans-serif;
    box-shadow:0 8px 18px -6px rgba(108,60,224,.55);
  }
  .cta-btn:active{ background:var(--accent-600); }

  /* ---------- Sheet ---------- */
  .sheet-scrim{
    position:absolute; inset:0; background:rgba(10,6,20,.45); opacity:0; pointer-events:none;
    transition:opacity .22s ease; z-index:10;
  }
  .sheet-scrim.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--surface);
    border-radius:24px 24px 0 0; padding:10px 22px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,.35,1);
    z-index:11;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet .grabber{ width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 18px; }
  .sheet .check{

<script>
(function(){
  "use strict";

  var ICONS = {
    phone: '<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2.4" stroke="white" stroke-width="1.7"/><path d="M11 18.2h2" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>',
    laptop: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4.5" width="16" height="10.5" rx="1.4" stroke="white" stroke-width="1.7"/><path d="M2.5 18.5h19l-1.6-3.5H4.1L2.5 18.5Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    tv: '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="12" rx="1.6" stroke="white" stroke-width="1.7"/><path d="M9 20h6M12 16.5V20" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>',
    headphones: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 15v-3a8 8 0 0 1 16 0v3" stroke="white" stroke-width="1.7" stroke-linecap="round"/><rect x="2.6" y="14" width="4.4" height="6.4" rx="1.6" stroke="white" stroke-width="1.7"/><rect x="17" y="14" width="4.4" height="6.4" rx="1.6" stroke="white" stroke-width="1.7"/></svg>',
    washer: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="white" stroke-width="1.7"/><circle cx="12" cy="13.5" r="4.6" stroke="white" stroke-width="1.7"/><path d="M9.5 6.2h1M13.5 6.2h1" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>',
    watch: '<svg viewBox="0 0 24 24" fill="none"><rect x="7.5" y="7.5" width="9" height="9" rx="2.6" stroke="white" stroke-width="1.7"/><path d="M9.5 7.5V4.2h5V7.5M9.5 16.5v3.3h5v-3.3" stroke="white" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    wind: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 8h11a2.6 2.6 0 1 0-2.4-3.6" stroke="white" stroke-width="1.7" stroke-linecap="round"/><path d="M3 12h15a2.6 2.6 0 1 1-2.4 3.6" stroke="white" stroke-width="1.7" stroke-linecap="round"/><path d="M3 16h8" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6-5.9-3.3-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8L12 2.5Z"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 19c8 0 13-5 13-13-8 0-13 5-13 13Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M6 18c4-5 7-8 12-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 5-3 7.5-7 9-4-1.5-7-4-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none"><path d="M20 30" /><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    checkBig: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.2 5.2L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5.5M12 8v.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
    store: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 9.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.7"/><path d="M3 4h18l1.4 5a2.4 2.4 0 0 1-4.6.9 2.4 2.4 0 0 1-4.4 0 2.4 2.4 0 0 1-4.4 0 2.4 2.4 0 0 1-4.6-.9L3 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.7"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.3" stroke="currentColor" stroke-width="1.7"/><circle cx="17.5" cy="5.5" r="2.3" stroke="currentColor" stroke-width="1.7"/><circle cx="17.5" cy="18.5" r="2.3" stroke="currentColor" stroke-width="1.7"/><path d="M8.1 10.8l7.3-4.2M8.1 13.2l7.3 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    chevronDown: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  var PRODUCTS = [];
  var productsStatus = 'loading'; // 'loading' | 'ready' | 'error'

  var CATEGORIES = ['All','Mobiles','Laptops','TV & Audio','Wearables','Appliances'];
  var TENURES = [3,6,9,12,18,24];

  function loadProducts(){
    productsStatus = 'loading';
    renderAll();
    fetch('/api/products')
      .then(function(res){ if(!res.ok) throw new Error('Request failed'); return res.json(); })
      .then(function(data){
        PRODUCTS = data;
        productsStatus = 'ready';
        renderAll();
      })
      .catch(function(err){
        console.error('Failed to load products from /api/products', err);
        productsStatus = 'error';
        renderAll();
      });
  }

  var state = {
    tab:'marketplace',
    category:'All',
    query:'',
    openId:null,
    payOpen:false,
    variantSel:{},
    tenureSel:{},
    collapse:{},
    sheetOpen:false
  };

  function fmt(n){ return '&#8377;' + Math.round(n).toLocaleString('en-IN'); }
  function byId(id){ return PRODUCTS.filter(function(p){return p.id===id;})[0]; }

  function ensureVariantDefaults(p){
    if(!state.variantSel[p.id]){
      var sel = {};
      p.variants.forEach(function(v){ sel[v.type] = v.options[0].label; });
      state.variantSel[p.id] = sel;
    }
    if(!state.tenureSel[p.id]){
      var tenures = TENURES.filter(function(t){return t<=p.maxTenure;});
      state.tenureSel[p.id] = tenures[tenures.length-1];
    }
  }

  function currentPrice(p){
    ensureVariantDefaults(p);
    var sel = state.variantSel[p.id];
    var price = p.price;
    p.variants.forEach(function(v){
      var chosen = v.options.filter(function(o){return o.label===sel[v.type];})[0];
      if(chosen) price += chosen.delta;
    });
    return price;
  }

  function discountPct(p){
    if(p.mrp<=p.price) return 0;
    return Math.round((1 - p.price/p.mrp) * 100);
  }

  function buildVariantSections(p){
    return p.variants.map(function(v){
      var key = p.id+'|'+v.type;
      var collapsed = state.collapse[key]===true;
      var isColor = v.type==='Color';

      var body;
      if(isColor){
        body = '<div class="color-row">'+v.options.map(function(o){
          var sel = state.variantSel[p.id][v.type]===o.label;
          return (
            '<button class="color-bubble-wrap" data-action="select-variant" data-id="'+p.id+'" data-type="'+v.type+'" data-value="'+o.label+'">'+
              '<span class="color-bubble'+(sel?' sel':'')+'" style="background:'+o.hex+'"></span>'+
              '<span class="cb-name">'+o.label+'</span>'+
            '</button>'
          );
        }).join('')+'</div>';
      } else {
        body = '<div class="chip-row">'+v.options.map(function(o){
          var sel = state.variantSel[p.id][v.type]===o.label;
          var rowPrice = priceForOption(p, v.type, o);
          return (
            '<button class="chip-bubble'+(sel?' sel':'')+'" data-action="select-variant" data-id="'+p.id+'" data-type="'+v.type+'" data-value="'+o.label+'">'+
              '<span class="cb-label">'+o.label+'</span>'+
              '<span class="cb-price">'+fmt(rowPrice)+'</span>'+
            '</button>'
          );
        }).join('')+'</div>';
      }

      return (
        '<button class="collapse-head'+(collapsed?' collapsed':'')+'" data-action="toggle-collapse" data-key="'+key+'">'+
          '<span>Select your '+v.type+'</span>'+ICONS.chevronDown+
        '</button>'+
        (collapsed?'':body)
      );
    }).join('');
  }

  function variantSummary(p){
    return p.variants.map(function(v){ return state.variantSel[p.id][v.type]; }).join(' &middot; ');
  }

  function priceForOption(p, axisType, option){
    var price = p.price + option.delta;
    p.variants.forEach(function(v){
      if(v.type===axisType) return;
      var chosenLabel = state.variantSel[p.id][v.type];
      var chosen = v.options.filter(function(o){return o.label===chosenLabel;})[0];
      if(chosen) price += chosen.delta;
    });
    return price;
  }

  /* ---------------- TABS ---------------- */
  function renderTabs(){
    var labels = [['brands','Top Brands'],['nearby','Nearby Stores'],['marketplace','1Fi Marketplace']];
    document.getElementById('tabs').innerHTML = labels.map(function(t){
      var active = state.tab===t[0];
      return '<button class="tab'+(active?' active':'')+'" data-action="tab" data-tab="'+t[0]+'">'+t[1]+'<u></u></button>';
    }).join('');
  }

  /* ---------------- TAB CONTENT ---------------- */
  function renderTabContent(){
    var el = document.getElementById('tabcontent');
    if(state.tab==='brands'){
      el.innerHTML =
        '<div class="content-pad">'+
          '<div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--text-3)"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke-width="1.8" stroke-linecap="round"/></svg>'+
            '<input placeholder="Search online stores&hellip;" disabled></div>'+
          '<div class="empty">'+
            '<div class="ring">'+ICONS.store+'</div>'+
            '<h3 class="display">Top Brands</h3>'+
            '<p>Curated brand storefronts are coming soon here. Explore the 1Fi Marketplace tab in the meantime.</p>'+
          '</div>'+
        '</div>';
      return;
    }
    if(state.tab==='nearby'){
      el.innerHTML =
        '<div class="content-pad">'+
          '<div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--text-3)"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke-width="1.8" stroke-linecap="round"/></svg>'+
            '<input placeholder="Search stores&hellip;" disabled></div>'+
          '<div class="empty">'+
            '<div class="ring">'+ICONS.pin+'</div>'+
            '<h3 class="display">Nearby Stores</h3>'+
            '<p>Store locator for in-person No-Cost EMI purchases is coming soon.</p>'+
          '</div>'+
        '</div>';
      return;
    }
    // marketplace
    if(productsStatus==='loading'){
      el.innerHTML =
        '<div class="content-pad">'+
          '<div class="section-head"><h2 class="display">1Fi Marketplace</h2><span>Shop top products on No-Cost EMI</span></div>'+
          '<div class="empty"><div class="ring">'+ICONS.store+'</div><h3 class="display">Loading products&hellip;</h3><p>Fetching the latest catalog from the 1Fi database.</p></div>'+
        '</div>';
      return;
    }
    if(productsStatus==='error'){
      el.innerHTML =
        '<div class="content-pad">'+
          '<div class="section-head"><h2 class="display">1Fi Marketplace</h2><span>Shop top products on No-Cost EMI</span></div>'+
          '<div class="empty"><div class="ring">'+ICONS.store+'</div><h3 class="display">Couldn&rsquo;t load products</h3>'+
            '<p>Check that the local server and Postgres database are running, then try again.</p>'+
            '<button class="cta-btn" data-action="retry-products">Retry</button>'+
          '</div>'+
        '</div>';
      return;
    }
    var filtered = PRODUCTS.filter(function(p){
      var catOk = state.category==='All' || p.category===state.category;
      var q = state.query.trim().toLowerCase();
      var qOk = !q || (p.name.toLowerCase().indexOf(q)>-1) || (p.brand.toLowerCase().indexOf(q)>-1);
      return catOk && qOk;
    });

    var cardsHtml = filtered.map(function(p){
      var pct = discountPct(p);
      var swatches = '';
      var colorVariant = p.variants.filter(function(v){return v.type==='Color';})[0];
      if(colorVariant){
        swatches = '<div class="swatches">'+colorVariant.options.slice(0,4).map(function(o){
          return '<span class="swatch-dot" style="background:'+o.hex+'"></span>';
        }).join('')+'</div>';
      }
      return (
        '<button class="card" data-action="open-product" data-id="'+p.id+'">'+
          '<div class="tile" style="background:linear-gradient(135deg,'+p.grad[0]+','+p.grad[1]+')">'+
            (pct>0?'<span class="discount-badge">'+pct+'% OFF</span>':'')+
            ICONS[p.icon]+
          '</div>'+
          '<div class="body">'+
            '<span class="brand">'+p.brand+'</span>'+
            '<span class="name display">'+p.name+'</span>'+
            '<div class="price-line"><span class="price-now">'+fmt(p.price)+'</span>'+(pct>0?'<span class="price-mrp">'+fmt(p.mrp)+'</span>':'')+'</div>'+
            '<span class="emi-chip">EMI from '+fmt(Math.round(p.price/p.maxTenure))+'/mo</span>'+
            swatches+
          '</div>'+
        '</button>'
      );
    }).join('');

    el.innerHTML =
      '<div class="content-pad">'+
        '<div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--text-3)"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke-width="1.8" stroke-linecap="round"/></svg>'+
          '<input id="mkt-search" placeholder="Search products&hellip;" value="'+state.query.replace(/"/g,'&quot;')+'"></div>'+
        '<div class="section-head"><h2 class="display">1Fi Marketplace</h2><span>Shop top products on No-Cost EMI</span></div>'+
        '<div class="chips">'+CATEGORIES.map(function(c){
          return '<button class="chip'+(state.category===c?' active':'')+'" data-action="category" data-category="'+c+'">'+c+'</button>';
        }).join('')+'</div>'+
        '<div class="grid">'+(cardsHtml || '<p style="grid-column:1/-1;color:var(--text-3);font-size:13px;padding:20px 4px;">No products match your search.</p>')+'</div>'+
      '</div>';

    var input = document.getElementById('mkt-search');
    if(input){
      input.addEventListener('input', function(e){
        state.query = e.target.value;
        var caret = e.target.selectionStart;
        renderTabContent();
        var again = document.getElementById('mkt-search');
        if(again){ again.focus(); again.setSelectionRange(caret,caret); }
      });
    }
  }

  /* ---------------- PRODUCT DETAIL ---------------- */
  function renderDetail(){
    var detailEl = document.getElementById('detail');
    if(!state.openId){ detailEl.classList.remove('open'); return; }
    var p = byId(state.openId);
    ensureVariantDefaults(p);
    detailEl.classList.add('open');
    document.getElementById('detail-title').textContent = p.name;

    var price = currentPrice(p);
    var pct = discountPct(p);

    var highlightsHtml = p.highlights.map(function(h){
      return '<li>'+ICONS.leaf+'<span>'+h+'</span></li>';
    }).join('');

    var emiTenures = TENURES.filter(function(t){return t<=p.maxTenure;});
    var emiHintsHtml =
      '<div class="emi-hints">'+
        '<span class="section-label">EMI plans available</span>'+
        '<div class="emi-hint-row">'+emiTenures.map(function(t){
          var monthly = Math.round(price/t);
          return '<div class="emi-hint-chip"><span class="ehc-tenure">'+t+' mo</span><span class="ehc-amt">'+fmt(monthly)+'/mo</span></div>';
        }).join('')+'</div>'+
        '<span class="emi-hints-note">Pick a plan on the next screen</span>'+
      '</div>';

    document.getElementById('detail-scroll').innerHTML =
      '<div class="hero-tile" style="background:linear-gradient(135deg,'+p.grad[0]+','+p.grad[1]+')">'+ICONS[p.icon]+'</div>'+
      '<span class="pd-brand">'+p.brand+'</span>'+
      '<div class="pd-row"><h3 class="pd-name">'+p.name+'</h3><button class="icon-btn" aria-label="Share">'+ICONS.share+'</button></div>'+
      '<div class="rating-row">'+ICONS.star.replace('currentColor','#E8A317')+' <b>'+p.rating+'</b> ('+p.reviews+' reviews)</div>'+
      '<div class="price-block"><span class="now">'+fmt(price)+'</span>'+(pct>0?'<span class="mrp">'+fmt(p.mrp)+'</span><span class="off">'+pct+'% off</span>':'')+'</div>'+
      buildVariantSections(p)+
      '<div class="highlights"><h4>Highlights</h4><ul style="padding:0;margin:0;">'+highlightsHtml+'</ul></div>'+
      emiHintsHtml+
      '<div class="note">'+ICONS.shield+'<span>Buy now, pay later with EMI &mdash; backed by your mutual fund investments on 1Fi.</span></div>';

    document.getElementById('cta-bar').innerHTML =
      '<div class="cta-info"><span>Price</span><b>'+fmt(price)+'</b></div>'+
      '<button class="cta-btn" data-action="open-pay" data-id="'+p.id+'">Pay using 1Fi</button>';
  }

  /* ---------------- PAY USING 1FI ---------------- */
  function renderPay(){
    var payEl = document.getElementById('pay');
    if(!state.payOpen || !state.openId){ payEl.classList.remove('open'); return; }
    var p = byId(state.openId);
    ensureVariantDefaults(p);
    payEl.classList.add('open');

    var price = currentPrice(p);
    var vSummary = variantSummary(p);

    var tenures = TENURES.filter(function(t){return t<=p.maxTenure;});
    var selTenure = state.tenureSel[p.id];
    var minMonthly = Math.round(price/tenures[tenures.length-1]);
    var plansKey = p.id+'|plans';
    var plansCollapsed = state.collapse[plansKey]===true;

    var planRows = tenures.map(function(t){
      var sel = t===selTenure;
      var monthly = Math.round(price/t);
      return (
        '<button class="plan-row-flat'+(sel?' sel':'')+'" data-action="select-tenure" data-id="'+p.id+'" data-tenure="'+t+'">'+
          '<span class="radio-sm"></span>'+
          '<span><span class="pr-tenure">'+t+' months</span><br><span class="pr-tag">No-Cost EMI</span></span>'+
          '<span class="pr-amt">'+fmt(monthly)+'/mo</span>'+
        '</button>'
      );
    }).join('');

    document.getElementById('pay-scroll').innerHTML =
      '<div class="pd-card">'+
        '<span class="brand-pill">'+p.brand+'</span>'+
        '<div class="pd-card-tile" style="background:linear-gradient(135deg,'+p.grad[0]+','+p.grad[1]+')">'+ICONS[p.icon]+'</div>'+
      '</div>'+
      '<div class="pd-row"><h3 class="pd-name">'+p.name+'</h3><button class="icon-btn" aria-label="Share">'+ICONS.share+'</button></div>'+
      (vSummary?'<div class="vp-summary">'+vSummary+'</div>':'')+
      '<div class="amount-card">'+
        '<div class="section-label" style="margin-bottom:8px;">Suggested amount</div>'+
        '<div class="amount-value">'+fmt(price)+'</div>'+
        '<button class="plans-toggle" data-action="toggle-collapse" data-key="'+plansKey+'">'+
          '<span>Starts at <b>'+fmt(minMonthly)+'/mo</b></span>'+
          '<span class="link'+(plansCollapsed?' collapsed':'')+'">'+(plansCollapsed?'Show':'Hide')+' plans'+ICONS.chevronDown+'</span>'+
        '</button>'+
        (plansCollapsed?'':planRows)+
      '</div>'+
      '<div class="paying-to">'+
        '<span class="section-label">Paying to</span>'+
        '<div class="payee-row">'+
          '<span class="payee-avatar">'+ICONS.store+'</span>'+
          '<div><b>1Fi Marketplace</b><br><span class="muted">Verified merchant &middot; Instant EMI activation</span></div>'+
        '</div>'+
      '</div>';

    var monthly = Math.round(price/selTenure);
    document.getElementById('pay-cta').innerHTML =
      '<div class="cta-info"><span>Selected plan</span><b>'+fmt(monthly)+'/mo &times; '+selTenure+' mo</b></div>'+
      '<button class="cta-btn" data-action="proceed" data-id="'+p.id+'">Proceed to pay</button>';
  }

  /* ---------------- SHEET ---------------- */
  function renderSheet(){
    var scrim = document.getElementById('scrim');
    var sheet = document.getElementById('sheet');
    if(!state.sheetOpen){ scrim.classList.remove('open'); sheet.classList.remove('open'); return; }
    var p = byId(state.openId);
    var price = currentPrice(p);
    var tenure = state.tenureSel[p.id];
    var monthly = Math.round(price/tenure);
    var variantSummary = Object.keys(state.variantSel[p.id]).map(function(k){return state.variantSel[p.id][k];}).join(' &middot; ');

    sheet.innerHTML =
      '<div class="grabber"></div>'+
      '<div class="check">'+ICONS.checkBig+'</div>'+
      '<h3 class="display">EMI plan confirmed</h3>'+
      '<div class="summary">'+
        '<div class="row"><span>Product</span><span>'+p.name+'</span></div>'+
        (variantSummary?'<div class="row"><span>Variant</span><span>'+variantSummary+'</span></div>':'')+
        '<div class="row"><span>Tenure</span><span>'+tenure+' months</span></div>'+
        '<div class="divider"></div>'+
        '<div class="row"><span>Monthly EMI</span><span>'+fmt(monthly)+'/mo</span></div>'+
        '<div class="row"><span>Total payable</span><span>'+fmt(price)+'</span></div>'+
      '</div>'+
      '<div class="note">'+ICONS.info+'<span>No credit score required. No interest. Backed by your investments.</span></div>'+
      '<button class="done" data-action="close-sheet">Done</button>';

    scrim.classList.add('open');
    sheet.classList.add('open');
  }

  function renderAll(){
    renderTabs();
    renderTabContent();
    renderDetail();
    renderPay();
    renderSheet();
  }

  /* ---------------- EVENTS ---------------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');

    if(action==='tab'){
      state.tab = t.getAttribute('data-tab');
      document.getElementById('scroll').scrollTop = 0;
      renderAll();
    } else if(action==='retry-products'){
      loadProducts();
    } else if(action==='category'){
      state.category = t.getAttribute('data-category');
      renderTabContent();
    } else if(action==='open-product'){
      state.openId = t.getAttribute('data-id');
      state.payOpen = false;
      renderDetail();
      renderPay();
      document.getElementById('detail-scroll').scrollTop = 0;
    } else if(action==='close-product'){
      state.openId = null;
      state.payOpen = false;
      renderDetail();
      renderPay();
    } else if(action==='open-pay'){
      state.payOpen = true;
      renderPay();
      document.getElementById('pay-scroll').scrollTop = 0;
    } else if(action==='close-pay'){
      state.payOpen = false;
      renderPay();
    } else if(action==='toggle-collapse'){
      var key = t.getAttribute('data-key');
      state.collapse[key] = !state.collapse[key];
      renderPay();
    } else if(action==='select-variant'){
      var id = t.getAttribute('data-id'), type = t.getAttribute('data-type'), value = t.getAttribute('data-value');
      state.variantSel[id][type] = value;
      renderDetail();
      renderPay();
    } else if(action==='select-tenure'){
      var id2 = t.getAttribute('data-id');
      state.tenureSel[id2] = parseInt(t.getAttribute('data-tenure'),10);
      renderPay();
    } else if(action==='proceed'){
      state.sheetOpen = true;
      renderSheet();
    } else if(action==='close-sheet'){
      state.sheetOpen = false;
      state.openId = null;
      state.payOpen = false;
      renderSheet();
      renderDetail();
      renderPay();
    }
  });

  loadProducts();

  /* ---------------- THEME PREVIEW TOGGLE ---------------- */
  var SUN = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  var toggle = document.getElementById('theme-toggle');
  function currentForced(){
    if(document.body.classList.contains('force-dark')) return 'dark';
    if(document.body.classList.contains('force-light')) return 'light';
    return null;
  }
  function paintToggle(){
    var cur = currentForced();
    if(!cur){
      var explicit = document.documentElement.getAttribute('data-theme');
      cur = (explicit==='light'||explicit==='dark') ? explicit
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    toggle.innerHTML = (cur==='dark' ? SUN+'Light' : MOON+'Dark');
  }
  toggle.addEventListener('click', function(){
    var next = (currentForced() || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light')) === 'dark' ? 'light' : 'dark';
    document.body.classList.remove('force-dark','force-light');
    document.body.classList.add(next==='dark' ? 'force-dark' : 'force-light');
    paintToggle();
  });
  document.body.classList.add('force-light');
  paintToggle();
})();
</script>
